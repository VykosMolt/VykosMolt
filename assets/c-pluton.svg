<svg xmlns="http://www.w3.org/2000/svg" width="828" height="136" viewBox="0 0 828 136" role="img" aria-label="Pluton" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><defs><linearGradient id="w"><stop offset="0" stop-color="#56d364" stop-opacity=".16"/><stop offset=".7" stop-color="#56d364" stop-opacity="0"/></linearGradient></defs><rect x=".5" y=".5" width="827" height="135" rx="8" fill="#0d1117" stroke="#30363d"/><rect x="1" y="1" width="826" height="134" rx="7" fill="url(#w)"/><rect x="1" y="12" width="3" height="112" rx="1.5" fill="#56d364"/><text x="20.0" y="27.0" fill="#56d364" font-size="11" font-weight="600" textLength="19.8">APP</text><text x="808.0" y="27.0" fill="#8b949e" font-size="11" text-anchor="end" textLength="39.6">Kotlin</text><circle cx="758.4" cy="23" r="4" fill="#A97BFF"/><text x="20.0" y="52.0" fill="#e6edf3" font-size="14" font-weight="600" textLength="50.4">Pluton</text><text x="20.0" y="74.0" fill="#b1bac4" font-size="12" textLength="734.4">Learn French for real, with Pluton the black cat. Ten stages from A1 to C1: ten-minute runs over 7,334</text><text x="20.0" y="92.0" fill="#b1bac4" font-size="12" textLength="770.4">sentence-backed cards scheduled with FSRS, a 20,000-word dictionary, verb tables and dictées. A local-first</text><text x="20.0" y="110.0" fill="#b1bac4" font-size="12" textLength="252.0">PWA; progress stays on your device.</text></svg>
